<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Space Defender</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050814;
      color: #38bdf8;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 600px;
      max-width: 95vw;
      padding: 8px 16px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px 6px 0 0;
      font-weight: bold;
      font-size: 14px;
    }
    .hud span { color: #f8fafc; }
    canvas {
      background: #020617;
      border: 1px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
      border-radius: 0 0 6px 6px;
      max-width: 95vw;
      max-height: 75vh;
      display: block;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="scoreVal" style="color: #38bdf8;">0</span></div>
    <div>LIVES: <span id="livesVal" style="color: #ef4444;">▲ ▲ ▲</span></div>
    <div>WAVE: <span id="waveVal" style="color: #a855f7;">1</span></div>
  </div>
  <canvas id="gameCanvas" width="600" height="480"></canvas>
  <div class="hint">[◀ / ▶ or A/D] Rotate · [▲ or W] Thrust · [SPACE] Laser Fire · [P] Pause</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const waveVal = document.getElementById('waveVal');

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, duration = 0.08, type = 'square') {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 12,
      a: -Math.PI / 2,
      rot: 0,
      thrusting: false,
      thrust: { x: 0, y: 0 }
    };

    let lasers = [];
    let asteroids = [];
    let particles = [];
    let stars = [];
    let score = 0;
    let lives = 3;
    let wave = 1;
    let isGameOver = false;
    let isPaused = false;

    // Create background stars
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        alpha: Math.random() * 0.8 + 0.2
      });
    }

    function createAsteroid(x, y, r) {
      const vert = Math.floor(Math.random() * 5 + 7);
      const offsets = [];
      for (let i = 0; i < vert; i++) {
        offsets.push(Math.random() * 0.4 + 0.8);
      }
      return {
        x,
        y,
        xv: (Math.random() - 0.5) * (wave * 0.5 + 1.2),
        yv: (Math.random() - 0.5) * (wave * 0.5 + 1.2),
        r,
        a: Math.random() * Math.PI * 2,
        rot: (Math.random() - 0.5) * 0.04,
        vert,
        offsets
      };
    }

    function spawnWave() {
      waveVal.innerText = wave;
      asteroids = [];
      const count = 3 + wave;
      for (let i = 0; i < count; i++) {
        let x, y, dist;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
          dist = Math.hypot(x - ship.x, y - ship.y);
        } while (dist < 120);
        asteroids.push(createAsteroid(x, y, 35));
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      wave = 1;
      isGameOver = false;
      isPaused = false;
      scoreVal.innerText = '0';
      livesVal.innerText = '▲ ▲ ▲';
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.a = -Math.PI / 2;
      ship.thrust = { x: 0, y: 0 };
      lasers = [];
      particles = [];
      spawnWave();
    }

    function shootLaser() {
      if (lasers.length >= 6) return;
      lasers.push({
        x: ship.x + (4 / 3) * ship.r * Math.cos(ship.a),
        y: ship.y + (4 / 3) * ship.r * Math.sin(ship.a),
        xv: 7 * Math.cos(ship.a) + ship.thrust.x * 0.3,
        yv: 7 * Math.sin(ship.a) + ship.thrust.y * 0.3,
        life: 50
      });
      playBeep(880, 0.05, 'triangle');
    }

    function addExplosion(x, y, count = 12, color = '#38bdf8') {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 3 + 1;
        particles.push({
          x,
          y,
          xv: Math.cos(ang) * spd,
          yv: Math.sin(ang) * spd,
          life: 30,
          color
        });
      }
    }

    function update() {
      if (isGameOver || isPaused) return;

      // Rotate ship
      ship.a += ship.rot;

      // Thrust
      if (ship.thrusting) {
        ship.thrust.x += 0.12 * Math.cos(ship.a);
        ship.thrust.y += 0.12 * Math.sin(ship.a);
        // exhaust particle
        if (Math.random() < 0.6) {
          particles.push({
            x: ship.x - ship.r * Math.cos(ship.a),
            y: ship.y - ship.r * Math.sin(ship.a),
            xv: -Math.cos(ship.a) * 2 + (Math.random() - 0.5),
            yv: -Math.sin(ship.a) * 2 + (Math.random() - 0.5),
            life: 15,
            color: '#f59e0b'
          });
        }
      } else {
        ship.thrust.x *= 0.985;
        ship.thrust.y *= 0.985;
      }

      ship.x += ship.thrust.x;
      ship.y += ship.thrust.y;

      // Wrap ship
      if (ship.x < 0) ship.x = canvas.width;
      else if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      else if (ship.y > canvas.height) ship.y = 0;

      // Update lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.xv;
        l.y += l.yv;
        l.life--;

        // Wrap lasers
        if (l.x < 0) l.x = canvas.width;
        else if (l.x > canvas.width) l.x = 0;
        if (l.y < 0) l.y = canvas.height;
        else if (l.y > canvas.height) l.y = 0;

        if (l.life <= 0) {
          lasers.splice(i, 1);
        }
      }

      // Update asteroids
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.xv;
        a.y += a.yv;
        a.a += a.rot;

        if (a.x < -a.r) a.x = canvas.width + a.r;
        else if (a.x > canvas.width + a.r) a.x = -a.r;
        if (a.y < -a.r) a.y = canvas.height + a.r;
        else if (a.y > canvas.height + a.r) a.y = -a.r;

        // Laser collisions
        for (let j = lasers.length - 1; j >= 0; j--) {
          const l = lasers[j];
          if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
            lasers.splice(j, 1);
            addExplosion(a.x, a.y, 16, '#38bdf8');
            playBeep(220, 0.12, 'sawtooth');

            score += a.r > 25 ? 20 : (a.r > 15 ? 50 : 100);
            scoreVal.innerText = score;

            // Split asteroid
            if (a.r > 25) {
              asteroids.push(createAsteroid(a.x, a.y, 20));
              asteroids.push(createAsteroid(a.x, a.y, 20));
            } else if (a.r > 15) {
              asteroids.push(createAsteroid(a.x, a.y, 10));
              asteroids.push(createAsteroid(a.x, a.y, 10));
            }
            asteroids.splice(i, 1);
            break;
          }
        }
      }

      // Check ship collision with asteroids
      for (let i = 0; i < asteroids.length; i++) {
        const a = asteroids[i];
        if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r) {
          lives--;
          addExplosion(ship.x, ship.y, 25, '#ef4444');
          playBeep(120, 0.4, 'sawtooth');
          let icons = '';
          for (let l = 0; l < lives; l++) icons += '▲ ';
          livesVal.innerText = icons.trim() || 'NONE';

          if (lives <= 0) {
            isGameOver = true;
          } else {
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.thrust = { x: 0, y: 0 };
          }
          break;
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.xv;
        p.y += p.yv;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Next wave check
      if (asteroids.length === 0) {
        wave++;
        spawnWave();
        playBeep(600, 0.2, 'sine');
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1;

      // Draw Ship
      if (!isGameOver) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Nose
        ctx.moveTo(
          ship.x + (4 / 3) * ship.r * Math.cos(ship.a),
          ship.y + (4 / 3) * ship.r * Math.sin(ship.a)
        );
        // Left wing
        ctx.lineTo(
          ship.x - ship.r * ((2 / 3) * Math.cos(ship.a) + Math.sin(ship.a)),
          ship.y - ship.r * ((2 / 3) * Math.sin(ship.a) - Math.cos(ship.a))
        );
        // Center inset
        ctx.lineTo(
          ship.x - ship.r * (1 / 3) * Math.cos(ship.a),
          ship.y - ship.r * (1 / 3) * Math.sin(ship.a)
        );
        // Right wing
        ctx.lineTo(
          ship.x - ship.r * ((2 / 3) * Math.cos(ship.a) - Math.sin(ship.a)),
          ship.y - ship.r * ((2 / 3) * Math.sin(ship.a) + Math.cos(ship.a))
        );
        ctx.closePath();
        ctx.stroke();

        // Thrust flame
        if (ship.thrusting) {
          ctx.strokeStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(
            ship.x - ship.r * (1 / 3) * Math.cos(ship.a),
            ship.y - ship.r * (1 / 3) * Math.sin(ship.a)
          );
          ctx.lineTo(
            ship.x - ship.r * 1.5 * Math.cos(ship.a),
            ship.y - ship.r * 1.5 * Math.sin(ship.a)
          );
          ctx.stroke();
        }
      }

      // Draw Lasers
      ctx.fillStyle = '#38bdf8';
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Asteroids
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.5;
      asteroids.forEach(a => {
        ctx.beginPath();
        for (let j = 0; j < a.vert; j++) {
          const angle = a.a + (j * Math.PI * 2) / a.vert;
          const radius = a.r * a.offsets[j];
          const x = a.x + radius * Math.cos(angle);
          const y = a.y + radius * Math.sin(angle);
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // Draw Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      });

      // Game Over Screen
      if (isGameOver) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 30px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION FAILED', canvas.width / 2, canvas.height / 2 - 20);

        ctx.fillStyle = '#f8fafc';
        ctx.font = '16px Courier New';
        ctx.fillText('Final Score: ' + score, canvas.width / 2, canvas.height / 2 + 15);

        ctx.fillStyle = '#38bdf8';
        ctx.font = '14px Courier New';
        ctx.fillText('Press [SPACE] to Relaunch', canvas.width / 2, canvas.height / 2 + 50);
      } else if (isPaused) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('SYSTEM PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === 'p' || e.key === 'P') {
        isPaused = !isPaused;
        return;
      }

      if (isGameOver) {
        if (e.key === ' ' || e.code === 'Space') resetGame();
        return;
      }

      switch (e.key) {
        case 'ArrowLeft':
        case 'a':
        case 'A':
          ship.rot = -0.07;
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          ship.rot = 0.07;
          break;
        case 'ArrowUp':
        case 'w':
        case 'W':
          ship.thrusting = true;
          break;
        case ' ':
        case 'Space':
          shootLaser();
          break;
      }
    });

    window.addEventListener('keyup', e => {
      switch (e.key) {
        case 'ArrowLeft':
        case 'ArrowRight':
        case 'a':
        case 'd':
        case 'A':
        case 'D':
          ship.rot = 0;
          break;
        case 'ArrowUp':
        case 'w':
        case 'W':
          ship.thrusting = false;
          break;
      }
    });

    canvas.addEventListener('click', () => {
      if (isGameOver) resetGame();
    });

    resetGame();
    loop();
  </script>
</body>
</html>
